<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script defer src="./script.js"></script>
    <title>Time tracking dashboard</title>
  </head>
  <body>
    <main class="dashboard-container" role="dashboard-container">
      <aside class="profile-info" role="profile-info">
        <header class="profile-header" role="profile-header">
          <img
            src="./assets/images/image-jeremy.png"
            alt="Profile Picture"
            role="profile-picture"
          />
          <p role="profile-subtitle">Report For</p>
          <h1 role="profile-name">Jeremy Robson</h1>
        </header>
        <nav class="dashboard-navigation" role="dashboard-navigation">
          <a
            role="daily-button"
            data-period="daily"
            onclick="onNavigationClick(this.dataset.period)"
            >Daily</a
          >
          <a
            role="weekly-button"
            data-period="weekly"
            onclick="onNavigationClick(this.dataset.period)"
            >Weekly</a
          >
          <a
            role="monthly-button"
            data-period="monthly"
            onclick="onNavigationClick(this.dataset.period)"
            >Monthly</a
          >
        </nav>
      </aside>
      <section class="activities-section" role="activities-section">
        <article class="activity-container work" role="work-activity">
          <section class="activity-section" role="activity-section">
            <header class="activity-header" role="activity-header">
              <h2 class="activity-title" role="activity-title">Work</h2>
              <button class="options-button" role="options-button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="activity-time">
              <p
                class="activity-current-time"
                data-activity="Work"
                role="activity-current-time"
              ></p>
              <p
                class="activity-previous-time"
                data-activity="Work"
                role="activity-previous-time"
              ></p>
            </div>
          </section>
        </article>
        <article class="activity-container play" role="play-activity">
          <section class="activity-section" role="activity-section">
            <header class="activity-header" role="activity-header">
              <h2 class="activity-title" role="activity-title">Play</h2>
              <button class="options-button" role="options-button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="activity-time">
              <p
                class="activity-current-time"
                data-activity="Play"
                role="activity-current-time"
              ></p>
              <p
                class="activity-previous-time"
                data-activity="Play"
                role="activity-previous-time"
              ></p>
            </div>
          </section>
        </article>
        <article class="activity-container study" role="study-activity">
          <section class="activity-section" role="activity-section">
            <header class="activity-header" role="activity-header">
              <h2 class="activity-title" role="activity-title">Study</h2>
              <button class="options-button" role="options-button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="activity-time">
              <p
                class="activity-current-time"
                data-activity="Study"
                role="activity-current-time"
              ></p>
              <p
                class="activity-previous-time"
                data-activity="Study"
                role="activity-previous-time"
              ></p>
            </div>
          </section>
        </article>
        <article class="activity-container exercise" role="exercise-activity">
          <section class="activity-section" role="activity-section">
            <header class="activity-header" role="activity-header">
              <h2 class="activity-title" role="activity-title">Exercise</h2>
              <button class="options-button" role="options-button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="activity-time">
              <p
                class="activity-current-time"
                data-activity="Exercise"
                role="activity-current-time"
              ></p>
              <p
                class="activity-previous-time"
                data-activity="Exercise"
                role="activity-previous-time"
              ></p>
            </div>
          </section>
        </article>
        <article class="activity-container social" role="social-activity">
          <section class="activity-section" role="activity-section">
            <header class="activity-header" role="activity-header">
              <h2 class="activity-title" role="activity-title">Social</h2>
              <button class="options-button" role="options-button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="activity-time">
              <p
                class="activity-current-time"
                data-activity="Social"
                role="activity-current-time"
              ></p>
              <p
                class="activity-previous-time"
                data-activity="Social"
                role="activity-previous-time"
              ></p>
            </div>
          </section>
        </article>
        <article class="activity-container self-care" role="self-care-activity">
          <section class="activity-section" role="activity-section">
            <header class="activity-header" role="activity-header">
              <h2 class="activity-title" role="activity-title">Self Care</h2>
              <button class="options-button" role="options-button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="activity-time">
              <p
                class="activity-current-time"
                data-activity="Self Care"
                role="activity-current-time"
              ></p>
              <p
                class="activity-previous-time"
                data-activity="Self Care"
                role="activity-previous-time"
              ></p>
            </div>
          </section>
        </article>
      </section>
    </main>
  </body>
</html>
