<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/css/style.css">

  <title>Product preview card component</title>

</head>

<body>
  <main class="product-container">
    <img class="product-image" alt="product-image">
    <section class="product-description">
      <header>
        <p class="product-category">Perfume</p>
        <h1 class="product-title">Gabrielle Essence Eau De Parfum<h1>
      </header>
      <p class="product-info">
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>
      <section class="product-price-section">
        <span class="product-discount-price">$149.99</span>
        <span class="product-original-price"><s>$169.99</s></span>
      </section>
      <Button class="cart-button">
        <img src="./assets/images/icon-cart.svg" alt="Cart Icon"/>
        <span>Add to Cart</span>
      </Button>
    </section>
  </main>
</body>

</html>
