<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script defer src="./script.js"></script>
    <title>Time tracking dashboard</title>
  </head>
  <body>
    <main class="dashboard-container" role="main">
      <aside class="profile-info" role="complementary">
        <header class="profile-header" role="banner">
          <img
            src="./assets/images/image-jeremy.png"
            alt="Profile Picture"
            role="img"
          />
          <p role="profile-subtitle">Report For</p>
          <h1 role="profile-name" role="heading">Jeremy Robson</h1>
        </header>
        <nav class="dashboard-navigation" role="navigation">
          <a
            role="button"
            data-period="daily"
            onclick="onNavigationClick(this.dataset.period)"
            >Daily</a
          >
          <a
            role="button"
            data-period="weekly"
            onclick="onNavigationClick(this.dataset.period)"
            >Weekly</a
          >
          <a
            role="button"
            data-period="monthly"
            onclick="onNavigationClick(this.dataset.period)"
            >Monthly</a
          >
        </nav>
      </aside>
      <section class="activities-section" role="region">
        <article class="activity-container work" role="article">
          <section class="activity-section" role="region">
            <header class="activity-header" role="banner">
              <h2 class="activity-title" role="heading">Work</h2>
              <button class="options-button" role="button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                />
              </button>
            </header>
            <div class="activity-time" role="region">
              <p class="activity-current-time" data-activity="Work"></p>
              <p class="activity-previous-time" data-activity="Work"></p>
            </div>
          </section>
        </article>
        <article class="activity-container play" role="region">
          <section class="activity-section" role="region">
            <header class="activity-header" role="banner">
              <h2 class="activity-title" role="heading">Play</h2>
              <button class="options-button" role="button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="region">
              <p
                class="activity-current-time"
                data-activity="Play"
                role="activity-current-time"
              ></p>
              <p class="activity-previous-time" data-activity="Play"></p>
            </div>
          </section>
        </article>
        <article class="activity-container study" role="region">
          <section class="activity-section" role="region">
            <header class="activity-header" role="banner">
              <h2 class="activity-title" role="heading">Study</h2>
              <button class="options-button" role="button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="region">
              <p
                class="activity-current-time"
                data-activity="Study"
                role="activity-current-time"
              ></p>
              <p class="activity-previous-time" data-activity="Study"></p>
            </div>
          </section>
        </article>
        <article class="activity-container exercise" role="region">
          <section class="activity-section" role="region">
            <header class="activity-header" role="banner">
              <h2 class="activity-title" role="heading">Exercise</h2>
              <button class="options-button" role="button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="region">
              <p
                class="activity-current-time"
                data-activity="Exercise"
                role="activity-current-time"
              ></p>
              <p class="activity-previous-time" data-activity="Exercise"></p>
            </div>
          </section>
        </article>
        <article class="activity-container social" role="region">
          <section class="activity-section" role="region">
            <header class="activity-header" role="banner">
              <h2 class="activity-title" role="heading">Social</h2>
              <button class="options-button" role="button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="region">
              <p
                class="activity-current-time"
                data-activity="Social"
                role="activity-current-time"
              ></p>
              <p class="activity-previous-time" data-activity="Social"></p>
            </div>
          </section>
        </article>
        <article class="activity-container self-care" role="region">
          <section class="activity-section" role="region">
            <header class="activity-header" role="banner">
              <h2 class="activity-title" role="heading">Self Care</h2>
              <button class="options-button" role="button">
                <img
                  src="./assets/images/icon-ellipsis.svg"
                  alt="More Options"
                  role="ellipsis-image-button"
                />
              </button>
            </header>
            <div class="activity-time" role="region">
              <p
                class="activity-current-time"
                data-activity="Self Care"
                role="activity-current-time"
              ></p>
              <p class="activity-previous-time" data-activity="Self Care"></p>
            </div>
          </section>
        </article>
      </section>
    </main>
  </body>
</html>
